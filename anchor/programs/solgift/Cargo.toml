[package]
name = "solgift"
version = "0.1.0"
description = "A Gifting Platform on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solgift"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = "0.32.1"
mpl-token-metadata = "5.1.1"
solana-program = "4.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dev-dependencies]
litesvm = "=0.7.1"
solana-sdk = "2.3"
